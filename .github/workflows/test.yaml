name: Test

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        uses: bibipkins/dotnet-test-reporter@v1.5.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-title: Test Results
          results-path: ./files/success/*.trx
          allow-failed-tests: true
